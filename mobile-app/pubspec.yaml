name: campussave_mobile
description: "CampusSave - application mobile Flutter (étudiants, commerçants, administrateurs)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.0.0

  # Affichage des QR Codes de retrait.
  qr_flutter: ^4.1.0

  # Firebase (projet campussave-815dd, fonctions en europe-west1).
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  cloud_functions: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Analyse statique.
  analyzer: ^14.7.0

  path: any

flutter:
  uses-material-design: true

  assets:
    - assets/images/
