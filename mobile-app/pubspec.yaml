
name: campussave_mobile
description: "CampusSave — application mobile Flutter (étudiants, commerçants, administrateurs)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.0.0

  # Affichage des QR Codes de retrait.
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Analyse statique.
  analyzer: ^14.7.0

  path: any
flutter:
  uses-material-design: true

  assets:
    - assets/images/
