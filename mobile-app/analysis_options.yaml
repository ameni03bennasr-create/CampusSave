
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - web/**
    - pub_cache/**
    - test_write/**

linter:
  rules:
    # The project is a faithful port of an existing React codebase: French copy,
    # explicit widget trees and public API doc comments are kept on purpose.
    public_member_api_docs: false
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    avoid_print: true
